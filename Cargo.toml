[package]
name = "xsee_host"
version = "0.1.0"
edition = "2024"

[lib]
name = "xsee_host"
path = "src/lib.rs"

[[bin]]
name = "probe"
path = "src/main.rs"

[[bin]]
name = "wic"
path = "src/wic.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "fmt"
path = "src/bin/fmt.rs"

[[bin]]
name = "mkicons"
path = "src/bin/mkicons.rs"

[[bin]]
name = "view"
path = "src/bin/view.rs"

[dependencies]
image = { version = "0.25.10", features = ["png", "jpeg", "bmp", "gif", "tiff", "ico", "webp"] }
jpeg-decoder = "0.3.2"
crossbeam-channel = "0.5.17"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
] }
jpeg-encoder = "0.7.0"
tiff = "0.11.3"

[[bin]]
name = "sc"
path = "src/bin/sc.rs"

[[bin]]
name = "xsee"
path = "src/bin/browse.rs"
