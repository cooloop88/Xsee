[package]
name = "xsee_host"
version = "0.1.0"
edition = "2024"

# 发布版体积优先：strip 去符号，LTO + 单 codegen unit 合并代码段（全量重编约 3 分半）。
# 不用 panic="abort"：线程 panic 时让它死线程不杀进程，别的线程还能收尾。
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lib]
name = "xsee_host"
path = "src/lib.rs"

[[bin]]
name = "probe"
path = "src/main.rs"

[[bin]]
name = "wic"
path = "src/wic.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "fmt"
path = "src/bin/fmt.rs"

[[bin]]
name = "mkicons"
path = "src/bin/mkicons.rs"

[[bin]]
name = "view"
path = "src/bin/view.rs"

[dependencies]
# 认的格式是这七种起步，avif/exr/tga 等默认格式段也要保留（用户点名要支持）——
# 不关 default，多链的解码器是格式支持不是肥肉。其余格式（heic/psd/raw）走 WIC/自写解码。
image = { version = "0.25.10", features = ["png", "jpeg", "bmp", "gif", "tiff", "ico", "webp"] }
jpeg-decoder = "0.3.2"
crossbeam-channel = "0.5.17"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
] }
jpeg-encoder = "0.7.0"
tiff = "0.11.3"

[[bin]]
name = "sc"
path = "src/bin/sc.rs"

[[bin]]
name = "xsee"
path = "src/bin/browse.rs"
